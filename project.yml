name: Jday

options:
  bundleIdPrefix: com.zerohyeon
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Jday:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - Jday
    dependencies:
      # 위젯 익스텐션은 iOS 전용 — macOS 타겟에는 포함하지 않음
      - target: JdayWidgets
        embed: true
        platforms: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerohyeon.jday
        INFOPLIST_FILE: Jday/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5G6N83PM9C
        # 플랫폼별 entitlements: iOS는 푸시(aps-environment), macOS는 App Sandbox + iCloud
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Jday/Resources/Jday.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Jday/Resources/Jday.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Jday/Resources/Jday-macOS.entitlements
    info:
      path: Jday/Resources/Info.plist
      properties:
        CFBundleDisplayName: Jday
        CFBundleName: Jday
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSRequiresIPhoneOS: true
        NSUserNotificationsUsageDescription: "할 일, 일정, 이슈 알림을 위해 알림 권한이 필요합니다."
        NSCalendarsFullAccessUsageDescription: "Apple 캘린더 일정을 홈·캘린더 화면에 함께 표시하기 위해 캘린더 접근 권한이 필요합니다."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # CloudKit 변경 푸시를 받아 백그라운드에서 즉시 동기화
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: ""

  JdayWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JdayWidgets
      # 앱 타겟과 공유하는 모델·유틸 (파일 이동 없이 타겟 멤버십만 추가)
      - path: Jday/Models
      - path: Jday/Core/Extensions/Date+Extensions.swift
      - path: Jday/Core/Extensions/Color+Extensions.swift
      - path: Jday/Core/Services/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerohyeon.jday.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5G6N83PM9C
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: JdayWidgets/JdayWidgets.entitlements
        SKIP_INSTALL: true
    info:
      path: JdayWidgets/Info.plist
      properties:
        CFBundleDisplayName: Jday 위젯
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
