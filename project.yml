name: Jday

options:
  bundleIdPrefix: com.zerohyeon
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Jday:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - Jday
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerohyeon.jday
        INFOPLIST_FILE: Jday/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5G6N83PM9C
        # 플랫폼별 entitlements: iOS는 푸시(aps-environment), macOS는 App Sandbox + iCloud
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Jday/Resources/Jday.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Jday/Resources/Jday.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Jday/Resources/Jday-macOS.entitlements
    info:
      path: Jday/Resources/Info.plist
      properties:
        CFBundleDisplayName: Jday
        CFBundleName: Jday
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NSUserNotificationsUsageDescription: "할 일, 일정, 이슈 알림을 위해 알림 권한이 필요합니다."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen:
          UIColorName: ""
